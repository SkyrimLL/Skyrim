;------------------------------------------------------------------------------------------------
;									General Rules - Weapons
;------------------------------------------------------------------------------------------------

; These rules attempt to assign the appropriate icon based on standard WeapType keywords.
; If a mod author uses such keywords with their weapons, BOOBIES will recognize them.

