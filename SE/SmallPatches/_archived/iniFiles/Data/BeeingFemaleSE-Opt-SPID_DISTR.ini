; Beeing Female NG - SPID item distribution (vendor stock only)
;
; 3.5.13: the per-NPC seeding block (every female NPC getting tampons, pads,
; contraception, tonics and scrolls in her personal inventory) was removed.
; SPID cannot see MCM settings, so those items kept re-appearing on every
; respawn / cell reset even with the "NPCs are having relevant items" option
; turned off. NPC-carried items are now handed out only by the mod itself,
; which honors that MCM toggle. This file just keeps vendors stocked.
;
; To clean items already seeded onto NPCs in an existing save, set
; Global_RemoveSPIDitems=true in "BeeingFemale/AddOn/Default Global Settings.ini"
; for a play session (vendors are never stripped).

