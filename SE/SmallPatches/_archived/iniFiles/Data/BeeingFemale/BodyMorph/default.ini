; Beeing Female NG - BodyMorph slider profile
;
; Used when the MCM "Visual scaling type" is set to BodyMorph (RaceMenu /
; NiOverride body morphs). Pick a profile in MCM > Pregnancy > Visual Scaling.
;
; Up to 16 sliders per section:
;   MorphN    = BodySlide slider name (must exist in your body's morphs.tri,
;               i.e. meshes built with "Build Morphs" checked)
;   MorphNMax = value applied at maximum scale (1.0 = 100% slider,
;               negative values allowed)
; The MCM "Maximum belly size" / "Maximum breast size" sliders multiply on top.
;
; This default profile matches the classic Beeing Female sliders and works
; with CBBE, 3BA and BHUNP bodies. The "CBBE 3BA.ini" and "BHUNP.ini"
; profiles use body-specific blends for a more natural late-pregnancy shape.

[Belly]
Morph1=PregnancyBelly
Morph1Max=1.0

[Breasts]
Morph1=BreastsSH
Morph1Max=1.0
Morph2=BreastsNewSH
Morph2Max=1.0
