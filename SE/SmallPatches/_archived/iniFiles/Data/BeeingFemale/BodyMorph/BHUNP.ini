; Beeing Female NG - BodyMorph slider profile for BHUNP (UUNP Next Gen) bodies.
; BHUNP has no BreastsSH slider - it uses BreastsSSH instead.
; BreastsSmall is applied with a POSITIVE weight here where CBBE 3BA.ini needs a
; negative one. That opposite sign is deliberate, not a typo: SGO4IF ships the
; same split across its own per-body slider tables (3BA BreastsSmall -0.3,
; BHUNP BreastsSmall +0.1) with identical apply math. Do not "correct" it to
; match the sibling profile.
; See default.ini for the format description.

[Belly]
Morph1=PregnancyBelly
Morph1Max=1.0

[Breasts]
Morph1=BreastsSSH
Morph1Max=0.4
Morph2=DoubleMelon
Morph2Max=0.25
Morph3=BreastsSmall
Morph3Max=0.1
