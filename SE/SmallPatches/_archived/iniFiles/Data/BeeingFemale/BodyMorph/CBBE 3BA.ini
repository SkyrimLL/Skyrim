; Beeing Female NG - BodyMorph slider profile for CBBE / CBBE 3BA bodies.
; Blends several sliders for a rounder belly and a fuller, heavier breast
; shape instead of pushing a single slider to its extreme.
; See default.ini for the format description.

[Belly]
Morph1=PregnancyBelly
Morph1Max=1.0

[Breasts]
Morph1=BreastsNewSH
Morph1Max=0.4
Morph2=DoubleMelon
Morph2Max=0.25
Morph3=BreastsSmall
Morph3Max=-0.2
Morph4=BreastWidth
Morph4Max=-0.1
