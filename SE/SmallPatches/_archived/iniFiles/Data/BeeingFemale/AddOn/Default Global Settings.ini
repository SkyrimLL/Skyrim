# Beeing Female NG - default GLOBAL settings (single source of truth).
#
# A type=global add-on must exist only ONCE (active) in the "BeeingFemale/AddOn"
# folder, and this is it. It holds EVERY global setting at its default value -
# edit a value to change that setting for all races, then set enabled=true
# (below) to apply it. Do not add a second type=global add-on, or the two will
# conflict (the alphabetically first one wins).

[AddOn]
# Name / description / author shown on the BeeingFemale MCM AddOn page.
name=Default Global Settings
description=Beeing Female NG default global settings - every global option in one place. This is the single active global add-on; edit it to change settings for all races.
author=Beeing Female NG

# Must stay type=global (applies to all races). Only one active type=global allowed.
type=global

# Set enabled=true to make these settings apply. (Left disabled by default so it
# never silently overrides; the values below are all the system defaults anyway.)
enabled=false
hidden=false
locked=false

#--------------------------------------------------------------------------------------
# Female NPCs not in the player's cell lose BeeingFemale items when you return.
# Only for cleaning up after BeeingFemaleSE-Opt-SPID. Default: false.
Global_RemoveSPIDitems=false

# If true, the player is not given the startup items (books and scrolls). Default: false.
Global_DisableStartupItems=false

# Delay (seconds) before the BF widget fades out after being shown. 0 = system default (3s).
Global_WidgetFadeOutTime=0
# Fade time before flashing, for widgets set to flash. 0/negative = default (0.01s).
Global_WidgetFlashShowTime=0
# Fade time for widgets set NOT to flash. 0/negative = default (0.2s).
Global_WidgetNoFlashShowTime=0

# Play pain sounds during labor / cycle pains (BF's bundled female pain sound, used
# for SexLab and OStim setups alike). Set false to silence them. Default: true.
Global_PlayPainSounds=true
#--------------------------------------------------------------------------------------

# [1. Female-related Settings]

# Disable pregnancy for all females regardless of race. Default: false.
Global_DisablePregnancy=false

# Scales the max pregnancy chance (e.g. MCM 40% x 2.0 = 80%). Must be > 0.1. Default: 1.0.
Global_ChanceToBecomePregnantScale=1.0

# How long contraception lasts (1.0 = 24h, 1.5 = 36h). Range 1.0-8.0. Default: 1.0.
Global_ContraceptionDuration=1.0

# Cycle / pregnancy phase duration multipliers. Default: 1.0 each.
Global_Duration_01_Follicular=1.0
Global_Duration_02_Ovulation=1.0
Global_Duration_03_Luteal=1.0
Global_Duration_04_Menstruation=1.0
Global_Duration_05_Trimester1=1.0
Global_Duration_06_Trimester2=1.0
Global_Duration_07_Trimester3=1.0
Global_Duration_08_Recovery=1.0

# Labor-pains phase length (days). Range 0.0833 (2h) - 1.0 (24h). Default: 0.18 (~4h).
Global_Duration_09_LaborPains=0.18
# Seconds between labor pains. Default: 1.0.
Global_Duration_10_SecondsBetweenLaborPains=1.0
# Seconds between each baby being born (multiples). Default: 1.0.
Global_Duration_11_SecondsBetweenBabySpawn=1.0

# Irregular-menstruation chance / severity scales. Default: 1.0 each.
Global_Irregulation_Chance_Scale=1.0
Global_Irregulation_Value_Scale=1.0

# Chance of conceiving multiples / max multiples. Max babies cannot exceed 6. Default: 1.0 each.
Global_Multiple_Threshold_Chance=1.0
Global_Multiple_Threshold_Max_Babys=1.0

# Health-damage multipliers for the various events. Default: 1.0 each.
Global_Pain_Abortus=1.0
Global_Pain_GivingBirth=1.0
Global_Pain_LaborPains=1.0
Global_Pain_Mittelschmerz=1.0
Global_Pain_Phase_CyclePains=1.0
Global_Pain_Phase_PregnantPains=1.0
Global_Pain_PMS=1.0

# PMS chance scale. Default: 1.0.
Global_PMS_ChanceScale=1.0

# Belly / breast size scales (single and multiple). Default: 1.0 each.
Global_Sizes_Belly_Max=1.0
Global_Sizes_Belly_Max_Multiple=1.0
Global_Sizes_Breasts_Max=1.0
Global_Sizes_Breasts_Max_Multiple=1.0

# Relative per-trimester belly / breast scales. Default: 0 each.
Global_Preg1stBellyScale=0
Global_Preg2ndBellyScale=0
Global_Preg3rdBellyScale=0
Global_Preg1stBreastsScale=0
Global_Preg2ndBreastsScale=0
Global_Preg3rdBreastsScale=0

# Multiple-birth chance tied to sperm amount. Default: 0 each.
Global_MultipleBabySperm=0
Global_MultipleBabyChancePerSperm=0

# Baby healing / damage rate when a pregnant woman is attacked. Default: 1.0 each.
Global_Baby_Healing_Scale=1.0
Global_Baby_Damage_Scale=1.0
#--------------------------------------------------------------------------------------

# [2. Male-related Settings]

# Sperm survival time scale. Default: 1.0.
Global_Duration_MaleSperm=1.0
# Sperm amount per ejaculation. Default: 1.0.
Global_Sperm_Amount_Scale=1.0
# Male recovery time after intercourse. Default: 1.0.
Global_Male_Recovery_Scale=1.0
# Chance sperm ignores contraception. Default: 0.
Global_Ignore_Contraception_Prob=0
# Allow impregnation regardless of the female's cycle. Default: false.
Global_Allow_Impregnation_For_Any_Period=false
# (Only when the above is true) impregnation chance for any period. Default: 0.
Global_Sperm_Impregnation_Prob_For_Any_Period=0
# Flat boost to impregnation probability. Default: 0.
Global_Sperm_Impregnation_Boost=0
# Baby healing / damage scale modifiers based on the father. Default: 1.0 each.
Global_Modify_Baby_Healing_Scale_by_FatherRace=1.0
Global_Modify_Baby_Damage_Scale_by_FatherRace=1.0
#--------------------------------------------------------------------------------------

# [3. Baby-related Settings]

# Force all babies to use a specific baby model regardless of race. Default: false.
Global_Female_Force_This_Baby=false
# Baby actor models (NPC parents / player as parent). Format PluginName:FormID. Empty = unused.
Global_BabyActor_Female=
Global_BabyActor_FemalePlayer=
Global_BabyActor_Male=
Global_BabyActor_MalePlayer=
# Mix specified baby models with copied-ActorBase babies. Default: false.
Global_MixWithCopyActorBase=false
# Probability a specified baby actor is born. Default: 0.
Global_ProbChildActorBorn=0
# Allow babies to talk to the player. Default: false.
Global_AllowPCDialogue=false
# Newborn initial / fully-grown final size scale. Defaults: 0.7 / 1.0.
Global_initialScale=0.7
Global_finalScale=1.0
# Babies born fully grown. Default: false.
Global_DisableMatureTime=false
# Growth-time scale and number of growth steps to maturity. Defaults: 1.0 / 3.
Global_MatureTimeScale=1.0
Global_MatureStep=3
# Give all babies reproductive capability immediately. Default: false.
Global_AllowUnrestrictedS=false
# Flag (still-)child actors as Protected (only the player can kill them). Default: false.
Global_ProtectedChildActor=false

# Apply the womb-state SlaveTats overlay to tracked female NPCs, not just the
# player. EXPENSIVE: the womb tattoo re-applies on every cycle/semen change, so
# enabling this for every tracked NPC means many SlaveTats overlay rebuilds (and
# the overlay is on the belly - rarely visible on clothed NPCs). Leave off unless
# you run a nude-NPC / follower setup and accept the performance cost. Default: false.
Global_WombTattooNPCs=false
#--------------------------------------------------------------------------------------

# [4. Grown-up / matured-adult Settings]

# Force "Children grow into adults" for all races, overriding the MCM toggle.
# true = always grow up, false = follow the MCM toggle. Default: false.
Global_GrowUpToAdult=false

# Let grown-up children become vanilla marriage candidates. Default: false.
Global_AllowAdultMarriage=false

# Protection for matured grown-up adults:
#    1 = Protected (survive combat, only the player can kill them - like followers)
#   -1 = fully killable (clears both Protected and Essential)
#    0 = leave the actor base's own setting from the ESP untouched (BeeingFemaleAdultPack has them protected)
# Default: 0.
Global_ProtectGrownAdult=0
#=========================================================
