; MCM Unlocked - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

# Automatically resets all registered MCM data when loading a save created before MCM Unlocked was installed.
bResetMCMForOlderSaves = 1

# If enabled, the mod will automatically overwrite or replace invalid script files with valid versions during initialization.
bOverwriteInvalidScripts = 1

# If enabled, the mod will extract and save script source files (psc) for debugging or development purposes.
bExtractScriptSources = 0


[Input]
# DIK key code used to reset MCM state while holding Ctrl [Default: 19 (R Key)]
iResetKey = 19

# Mouse button used to trigger rename action [Default: 1 (Right mouse button)]
iRenameKey = 1

# Mouse button used to trigger reorder action [Default: 2 (Middle mouse button)]
iReorderKey = 2


