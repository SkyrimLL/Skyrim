; ============================================================================
; party_blacklist.ini
; Hide specific followers/summons from Follower HUD and Party Sheet
; ============================================================================
; DO NOT EDIT THIS FILE. It ships with Skyrim Party Sheet and may be
; overwritten by future updates, losing your changes.
;
; To hide your own actors, create a NEW file next to this one ending in
; "_party_blacklist.ini", e.g.  MyMod_party_blacklist.ini
; The mod scans every *_party_blacklist.ini in this folder and MERGES them
; with this base list, so your entries are additive and update-safe.
; ----------------------------------------------------------------------------
;
; FORMAT: Plugin.esp|0xFormID (use local FormID from plugin, no leading zeros)
; - ESM: Skyrim.esm|0x918E2
; - ESP: MyFollowerMod.esp|0x1234
; - ESL: Pigglet.esp|0x827
;
; Or use name (exact match, case sensitive):
; Flame Atronach
;
; Examples per line:
; Skyrim.esm|0x918E2
; Uthgerd the Unbroken