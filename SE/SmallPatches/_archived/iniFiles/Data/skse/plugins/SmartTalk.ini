; Smart Talk - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

# When enabled, the quest filtering system will load asynchronously, preventing any delay during game startup (1 enable, 0 disable).
bAsynchronousStartup = 1


[QuestFilters]
# Enable or disable the system that detects quest-related dialogue options (1 enable, 0 disable).
bEnable = 1

# Enable or disable using a dynamic and autonomous cache system for quest dialogue data.
# This system keeps the cache up to date automatically and makes loading times virtually unnoticeable.
bUseCache = 1

# Determines which Papyrus functions are analyzed when identifying quest-related dialogue.
# This affects how Smart Talk interprets Papyrus scripts to decide whether a dialogue line is linked to a quest.
# Available modes:
#    0: Only Start() / Stop() functions are considered.
#    1: Only SetStage() functions are considered.
#    2: Both Start()/Stop() and SetStage() functions are considered.
iPapyrusFilterMode = 2

# Only include dialogue whose script is explicitly linked to a quest.
# 1 = Enabled, 0 = Disabled (allows all quest scripts even without an explicitly linked quest)
bRequireLinkedQuest = 0

# Include only explicitly linked quests based on their type or content.
#    0: All quest types
#    1: Quests with non-null type
#    2: Quests with at least one objective
#    3: Quests with non-null type OR at least one objective
iLinkedQuestFilter = 3


[QuestUI]
# Defines how quest-related dialogue entries are visually marked in the UI.
# UI mod authors can provide their own QuestUI configuration file (SmartTalk_CustomUI.ini).
# If bOverrideUISettings = 1, user-defined settings below will override the UI mod's configuration.

# Allow the user's configuration to override the UI mod's default settings (1 enable, 0 disable).
bOverrideUISettings = 0

# Dialogue sorting behavior
#    0: Default (game order)
#    1: Quest dialogues first
#    2: Quest dialogues last
#    3: Alphabetical (all)
#    4: Quest first + alphabetical
#    5: Quest last + alphabetical
iDialogueSortMode = 0

# Enable or disable the quest marker icon linked to quest-related dialogue lines (1 enable, 0 disable).
bDisplayIcon = 1

# Color for quest-related dialogue entries (e.g. 0xFF0000 = Red).
# Must be written in hexadecimal WITH the "0x" prefix.
cQuestEntryColor = 0xFFD966

# Path to the variable used to define the color applied to quest-related dialogue entries.
# This setting is always controlled by the UI mod's configuration.
sQuestColorVariable = _root.DialogueMenu_mc.TopicList.iQuestColor

# Path to the variable used to control the visibility of the quest marker icon.
# This setting is always controlled by the UI mod's configuration.
sQuestIconVisibleVariable = _root.DialogueMenu_mc.TopicList.bQuestIconVisible

# Path to the main function responsible for updating the text and visuals of dialogue entries.
# Hook or override this function to allow the framework to apply custom colors and markers to entries when they are updated on screen.
sSetEntryTextFunction = _root.DialogueMenu_mc.TopicList.SetEntryText

# Path to an optional custom ActionScript function used to update dialogue entry text and visuals.
# Similar to SetEntryText, but includes a boolean parameter indicating whether the entry is a quest line.
# This function must reside at the same level in the MovieClip hierarchy as SetEntryText.
# It is called with the following parameters: aEntryClip, aEntryObject, bIsQuestLine.
sSetEntryTextCustomFunction = SetEntryTextCustom

# Name of the MovieClip (ideally a Sprite) that contains the quest marker visual.
# This clip will be inserted next to quest lines in the dialogue menu.
sQuestMarkerClip = QuestMarker


[DialogueSkip]
# Skip the current dialogue immediately on player input, ignoring the game's usual delay.
bSkipImmediateOnInput = 1

# When enabled, holding the action key will skip responses one by one.
bHoldToSkip = 1

# Duration (in milliseconds) the action key must be held before auto-skipping responses.
iHoldDuration = 500

# Interval (in milliseconds) between automatically skipped responses when holding the action key.
iAutoSkipInterval = 150

# Skip the current dialogue when interacting with a speaking NPC, opening the dialogue window.
bSkipOnInteraction = 0

# If DBVO is installed, Smart Talk will also allow player dialogues to be skipped smoothly.
bDBVOIntegration = 1

# This parameter determines the behavior to adopt when a dialogue line triggers the execution of a Papyrus script fragment.
# Precautions are necessary because skipping a dialogue too early may prevent the fragment from running, potentially causing the dialogue to repeat.
# The available methods are:
#    0: None (some dialogues may not complete if skipped too quickly)
#    1: Completely block the ability to skip the affected dialogues
#    2: Use the "onCancelPress" method, which simulates exiting the menu for the affected dialogues
#    3: Apply a forced pause of at least 500ms before the affected dialogues can be skipped
iPapyrusHandle = 3


[DialoguePause]
# Enable dynamic pause between consecutive dialogue lines.
bEnabled = 1

# Minimum pause duration (in milliseconds) between two dialogue lines.
iMinDelay = 200

# Maximum pause duration (in milliseconds) between two dialogue lines.
iMaxDelay = 800
