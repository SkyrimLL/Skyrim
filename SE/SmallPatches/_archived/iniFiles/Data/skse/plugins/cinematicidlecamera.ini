;=================================CAMERA MAIN SETTINGS=================================

; Camera Idle Timer (seconds without any player input before idle mode activates)
fIdleTimer=80

; Block Idle Camera In Combat (0 = off, 1 = on)
preventVanityInCombat=1

; Cinematic Black Bars Enabled (0 = off, 1 = on)
blackBarsEnabled=1

; Speed at which cinematic bars slide in/out
blackBarsSlideSpeed=1

; Black Bars Sound Effects Enabled (0 = off, 1 = on)
blackBarsSoundEnabled=1


;===============================CAMERA POSITION SETTINGS===============================

; Idle Camera Offsets (Skyrim units, ~70 units per meter)
idleCameraOffsetX=75
idleCameraOffsetY=130
idleCameraOffsetZ=0

; Idle Camera World Collision (0 = off, 1 = on)
vanityCameraCollisionEnabled=0

; Camera Blend Duration (seconds for a POI-switch / entry / exit blend)
blendDuration=5


;=============================CAMERA ZOOM/DEZOOM SETTINGS==============================

; Dynamic Dezoom: pulls the camera back when a POI is both close to the player and well above them, since this system only rotates yaw and can't tilt to keep it in frame.

; How far above the player a POI must be, while inside the trigger radius, before the dezoom kicks in.
dezoomTriggerRadius=350

; Horizontal distance from the player within which an overhead POI can trigger the dezoom.
dezoomTriggerHeight=210

; How far the camera pulls back once the dezoom is fully active (added on top of the Idle camera offset Y).
dezoomAmount=250

; How quickly the dezoom fades in and out as a POI enters or leaves the trigger zone.
dezoomBlendSpeed=0.7


;===============================HEAD TRACKING SETTINGS=================================

; Head-Track Fade Speed (units/sec)
headTrackFadeSpeed=0.3


;===============================POI SYSTEM SETTINGS====================================

; POI System master toggle (0 = off, 1 = on)
poiSystemEnabled=1

; POI type toggles (0 = off, 1 = on)
actorPoiEnabled=1
insectsAndFishPoisEnabled=1

; Prevent Followers from being targeted (0 = off, 1 = on)
preventFollowers=1

; POI Detection Radius (Skyrim units, ~70 units per meter)
poiDetectionRadius=1050

; POI Lock Duration (seconds the camera must stay on a POI before it can switch)
lockDuration=5


;==================================EXCLUSION LIST======================================

; Add actors here to prevent them from being detected as POIs
; Format: exclusionList=BaseFormID
; Example: exclusionList=000132A5
; (1 actor = 1 line)
; No actors in exclusion list


;===============================ACTOR SCORE SETTINGS===================================

; Base score awarded to an actor per action state, plus an optional proximity bonus
; (added on top of the initial score, and then scaled by how close the POI is relative to the player)

; Dragon specific scores (highest priority)
dragonScore=2000
dragonProximityEnabled=1
dragonProximityFactor=1000
dragonEnabled=1

actorCombatScore=600
actorCombatProximityEnabled=1
actorCombatProximityFactor=200
actorCombatEnabled=1

actorMovingScore=400
actorMovingProximityEnabled=1
actorMovingProximityFactor=150
actorMovingEnabled=1

actorInSceneScore=300
actorInSceneProximityEnabled=1
actorInSceneProximityFactor=50
actorInSceneEnabled=1

actorIdleScore=10
actorIdleProximityEnabled=1
actorIdleProximityFactor=50
actorIdleEnabled=1


;============================INSECTS & FISH SCORE SETTINGS=============================

; Insects (butterflies, moths, dragonflies, etc)
insectsScore=400
insectsProximityEnabled=1
insectsProximityFactor=150
insectsEnabled=1

; Fish (perches, salmon, etc)
fishScore=300
fishProximityEnabled=1
fishProximityFactor=150
fishEnabled=1


;==================================DEBUG SETTINGS======================================

; Debug Raycast Visualization (0 = off, 1 = on)
debugRaycasts=0

; Log Level (0=Quiet/critical, 1=Warnings, 2=Info, 3=Debug)
logginglevel=2
