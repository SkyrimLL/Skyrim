[StampDefaults]
;===================================================================
; This settings HEAVILY change how SNOW trail/trench/floor look like
;===================================================================
SnowStampReposeRate = 0.10 ;quick snow collapse effect
SnowStampRimSpan    = 1.5  ;how far bumpy snow spreads
SnowStampRimNoise   = 1.5  ;how much bumpy snow
SnowStampRimLean    = 0.00  ;how lean/sharp rim 
SnowStampChurn      = 1.3 ;snow floor bumpy

;===================================================================
; This settings HEAVILY change how ALL OTHER surfaces
; trail/trench/floor look like
;===================================================================

StampReposeRate     = 0.01 ;quick collapse of footprint
StampRimSpan        = 0.7  ;how wide noise spread around footprint
StampRimNoise       = 1.0  ;how much noise in footprint
StampRimLean        = 0.1  ;how lean/sharp rim
StampChurn          = 0.0 ;floor messed up 

;==================================================================
;This settings group land textures that use same look of footprint
;They define the final look of footprint
;==================================================================
;Textures  = tex that will share the same look, you can make many profiles and use just one tex
;Type= Snow ; used to make tex in this profile be raised like snow//add it to ash profile for example 
;Depth     = how deep in terrain      
;Radius    = how wide 
;Shoulder  = how sharp edges are
;Decay     = how fast it disappears
;Rim       = how tall edges are
;clearance = how much above ground feet can be and still leave footprint
[Snow]
Textures  = snow01.dds, snow01alta.dds, snow01landscape.dds, snow02.dds, snow02alta.dds, snow02landscape.dds
Type= Snow
Depth     = 2        
Radius    = 2.0
Shoulder  = 0        
Decay     = 1.8
Rim       = 2
clearance = 25


