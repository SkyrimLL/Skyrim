; Ricochet Framework - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

# When enabled, this parameter allows the framework's resources to be loaded asynchronously, preventing any delay in the game's startup (1 enable, 0 disable).
bAsynchronousStartup = false

# If enabled, the mod will automatically overwrite or replace invalid script files with valid versions during initialization.
bOverwriteInvalidScripts = true

# If enabled, the mod will extract and save script source files (psc) for debugging or development purposes.
bExtractScriptSources = false


[Global]
# Global speed multiplier for all arrow projectiles.
fProjectileSpeedMult = 1.0

# Global gravity multiplier for all arrow projectiles.
fProjectileGravityMult = 1.0

# Global range multiplier for all arrow projectiles.
fProjectileRangeMult = 1.0

# Global force multiplier applied to arrow projectiles (physical impulse applied to the hitted objects).
fProjectileForceMult = 1.0

# Maximum number of arrows that can remain in the world (lost arrows on the ground or stuck in static objects).
iMaxWorldArrows = 32

# Maximum number of arrows that can remain stuck (sticky) in a single actor’s body at the same time.
iMaxStickyActorArrows = 8


[Ricochet]
# Enables or disables ricochet mechanics (1 enable, 0 disable).
bStatus = true

# Minimum velocity required for a projectile to ricochet.
fMinVelocity = 1400.0

# Maximum bounce angle allowed for ricochets (0.0 to 1.0).  
# 1.0 represents a head-on collision, while 0.0 represents a grazing or nearly parallel impact.
fMaxBounceAngle = 0.5

# Minimum restitution factor applied during ricochet.
fRestitutionMin = 0.15

# Maximum restitution factor applied during ricochet.
fRestitutionMax = 0.85

# Overall restitution scaling factor (represents the amount of energy retained after a ricochet).
fRestitutionScale = 0.9

# Multiplier applied to the ricochet angle calculation.
fAngleInfluence = 1.2

# Velocity damping applied to the projectile after ricochet.
fVelocityDamp = 0.95

# Additional penalty applied to the Z-axis after ricochet.
fZPenalty = 10.0

# Gravity multiplier applied specifically during ricochet.
fGravityScale = 1.2

# Enables damage calculation based on restitution (1 enable, 0 disable).
# Damage dealt is proportional to the arrow's final velocity, so the more ricochets, the less damage.
bDamageByRestitution = true

# Damage multiplier applied for ricochet impacts (only if bDamageByRestitution is disabled).  
# Values above 1.0 increase damage with more ricochets, values below 1.0 decrease it.
fDamageMult = 1.0

# Determines whether impact visual effects should be shown (1 enable, 0 disable).
bPlayImpactEffect = true

# Determines if the impact effect follows the projectile rather than the surface (1 enable, 0 disable).
bEffectBoundToProjectile = true

# Determines whether a sound should play on ricochet (1 enable, 0 disable).
bPlayImpactSound = true

# Determines whether the projectile's trail disappears after a ricochet (1 fades out, 0 remains visible).
bTrailFade = false


[Fracture]
# Enables or disables the fracture system.
bStatus = true

# Determines the chance that a projectile not covered by the framework is unrecoverable (as the game already does by default).
# If bStatus is set to false, this variable will be used for all projectiles.
iDefaultRecoveryChance = 50

# Global multiplier for fracture chance (higher = more likely to break).
fGlobalMult = 1.0

# Minimum clamp for final fracture chance.
fChanceMin = 0.05

# Maximum clamp for final fracture chance.
fChanceMax = 0.95

# Multiplier for hard surfaces like stone or metal.
fSurfaceMultHard = 1.0

# Multiplier for soft surfaces like wood or cloth.
fSurfaceMultSoft = 0.75

# Multiplier for actors like NPCs or creatures.
fSurfaceMultActor = 0.5

# Base reference velocity for fracture calculations (0.0 = auto-detect).
fVelocityReference = 0.0

# Multiplier applied to the velocity ratio.
fVelocityMult = 1.2

# Minimum velocity required for a projectile to cause a fracture.
fVelocityMin = 1000.0

# Exponent for the angle calculation curve.
fAngleExponent = 1.5

# Multiplier based on impact angle.
fAngleMult = 1.2

# Allows picking up broken arrows.
bPickupBrokenArrows = true

# Enables extra fracture sounds.
bPlayFractureSounds = true

# Set the volume of sound effects added by the framework (between 0.0 and 1.0).
fFractureVolume = 1.0

# Enables extra fracture visual effects.
bPlayFractureEffects = true

# Determine if broken projectiles can be reforged at the forges.
bAmmoCanBeReforged = true

# Multiplier for broken arrow price compared to original.
fBrokenPriceMult = 0.5

# Multiplier for broken arrow weight compared to original.
fBrokenWeightMult = 0.5


[Impact]
# Enables or disables immproved impact mechanics (1 enable, 0 disable).
bStatus = true

# Linear rebound multiplier for impacts.
fLinearImpulseReboundMult = 1.0

# Linear ricochet multiplier for impacts.
fLinearImpulseRicochetMult = 1.0

# Minimum linear impulse applied during impact.
fLinearImpulseMin = 15.0

# Maximum linear impulse applied during impact.
fLinearImpulseMax = 50.0

# Multiplier applied to angular response during impact.
fAngularImpulseMult = 1.0

# Maximum random angular impulse value applied during impact.
fAngularRandomValue = 3.0

# Minimum velocity for the projectile to stick to a surface after impact.
fStickyVelocityMin = 1000.0

# Random roll variation applied to projectiles when sticking into a surface.
fStickyRollVariance = 1.0

# Overrides the mass of the arrow for impact calculations.
fForcedArrowMass = 5.0


[Retrieval]
# Enables or disables automatic arrow retrieval (1 enable, 0 disable).
bStatus = true

# Type of arrow retrieval:
#   0: Only intact arrows are retrieved
#   1: Intact arrows or broken pieces depending on what is picked up
#   2: Both arrows and broken pieces are retrieved
iType = 1

# Radius for automatic retrieval outside of combat (in units).
fSearchRadius = 512.0

# Radius for automatic retrieval during combat (in units).
fSearchRadiusCombat = 256.0


[Language]
# Format for displaying the name of a broken arrow in different languages.
# %s will be replaced by the original arrow's name.
BrokenAmmo_English = %s [broken]   
BrokenAmmo_French = %s [brisée]
BrokenAmmo_German = %s [zerbrochen]
BrokenAmmo_Spanish = %s [roto]
BrokenAmmo_Italian = %s [spezzata]
BrokenAmmo_Polish = %s [połamana]
BrokenAmmo_Russian = %s [сломанная]
BrokenAmmo_Japanese = %s [壊れた矢]
BrokenAmmo_Chinese = %s [损坏的箭]
