; Wheel hotkey. 0 = follow the game's Favourites binding (default).
;   Set a DirectInput scan code to give the wheel a key of its own --
;   needed if you put Inventory on the Favourites key, since the wheel
;   hides that key from the game and the bag would never open.
;   Common codes: Q=16 E=18 R=19 F=33 G=34 V=47 X=45 Z=44 CapsLock=58
; 휠 단축키. 0이면 게임의 즐겨찾기 키를 따라갑니다 (기본값).
;   DirectInput 스캔 코드를 넣으면 휠이 그 키를 씁니다. 즐겨찾기 키에
;   인벤토리를 배정했다면 반드시 옮겨야 합니다 -- 휠이 그 키를 게임에서
;   감추기 때문에 가방이 아예 열리지 않습니다.
;   자주 쓰는 코드: Q=16 E=18 R=19 F=33 G=34 V=47 X=45 Z=44 CapsLock=58
!wheelkey = 0
; Gamepad button, same rule. 0 = follow the game.
; 게임패드 버튼, 규칙 동일. 0이면 게임을 따라갑니다.
!wheelkeypad = 0
; A press SHORTER than this is a tap: the wheel stays open until
;   you press again. Longer is the hold it always was -- let go
;   and it applies. Milliseconds, 60 to 2000.
; 이 시간보다 짧게 누르면 탭입니다. 다시 누를 때까지 휠이
;   열린 채로 있습니다. 그보다 길면 종전과 같습니다 -- 놓는 순간
;   적용됩니다. 밀리초 단위, 60~2000.
!wheeltapms = 250

