;=========================|
; cheat config:           |
; > no teleport to jail   |
; > keep all stolen items |
; > don't pay crime gold  |
; > for any faction       |
;=========================|

; 0 is to use original value (aka disable the feature)
; 1 is to use new value only for vanilla factions
; 2 is to use new value only for non-vanilla factions
; 3 is to use new value in any case
[Modes]
GoToJailMode=3
RemoveStolenItemsMode=3
PayCrimeGoldMode=3

; new value for each feature
; 0 = false, 1 = true
[Values]
GoToJailValue=0
RemoveStolenItemsValue=0
PayCrimeGoldValue=0
