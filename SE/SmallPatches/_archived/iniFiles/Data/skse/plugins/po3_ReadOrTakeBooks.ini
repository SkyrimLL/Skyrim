[Settings]

;Default action upon activating books
;0 - Automatic (take read books) | 1 - Take | 2 - Read.
iDefaultAction = 0

;Press hotkey + Activate key to take instead of read, or vice versa. Default is Left Shift
;DXScanCodes : https://ck.uesp.net/wiki/Input_Script
iAlternateActionHotkey = 42

;Gamepad hotkey
iAlternateActionHotkeyGamePad = -1

;Learn spells from spell tomes directly.
bAutoUseSpellTomes = true
