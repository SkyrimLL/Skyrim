# Smart Talk - Custom UI Settings

# This file is designed for UI mod authors and should be provided with their mod.
# To enable/edit the settings below, simply remove the ';' before the variable name.
# Note that for certain options, such as displaying the quest icon or changing its color,
# the user can still override them if they have enabled the 'bOverrideUISettings' option.

[QuestUI]

# Dialogue sorting behavior
#    0: Default (game order)
#    1: Quest dialogues first
#    2: Quest dialogues last
#    3: Alphabetical (all)
#    4: Quest first + alphabetical
#    5: Quest last + alphabetical
;iDialogueSortMode = 0

# Enable or disable the quest marker icon linked to quest-related dialogue lines (1 enable, 0 disable).
;bDisplayIcon = 1

# Color for quest-related dialogue entries (e.g. 0xFF0000 = Red).
# Must be written in hexadecimal WITH the "0x" prefix.
;cQuestEntryColor = 0xFFD966

# Path to the variable used to define the color applied to quest-related dialogue entries.
# This setting is always controlled by the UI mod's configuration.
;sQuestColorVariable = _root.DialogueMenu_mc.TopicList.iQuestColor

# Path to the variable used to control the visibility of the quest marker icon.
# This setting is always controlled by the UI mod's configuration.
;sQuestIconVisibleVariable = _root.DialogueMenu_mc.TopicList.bQuestIconVisible

# Path to the main function responsible for updating the text and visuals of dialogue entries.
# Hook or override this function to allow the framework to apply custom colors and markers to entries when they are updated on screen.
;sSetEntryTextFunction = _root.DialogueMenu_mc.TopicList.SetEntryText

# Path to an optional custom ActionScript function used to update dialogue entry text and visuals.
# Similar to SetEntryText, but includes a boolean parameter indicating whether the entry is a quest line.
# This function must reside at the same level in the MovieClip hierarchy as SetEntryText.
# It is called with the following parameters: aEntryClip, aEntryObject, bIsQuestLine.
;sSetEntryTextCustomFunction = SetEntryTextCustom

# Name of the MovieClip (ideally a Sprite) that contains the quest marker visual.
# This clip will be inserted next to quest lines in the dialogue menu.
;sQuestMarkerClip = QuestMarker