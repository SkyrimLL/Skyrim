; ============================================================================
; party_allies.ini  -  Quest ally list (shown in Follower HUD / Party Sheet)
; ============================================================================
; DO NOT EDIT THIS FILE. It ships with Skyrim Party Sheet and may be
; overwritten by future updates, losing your changes.
;
; To add your own allies, create a NEW file next to this one ending in
; "_party_allies.ini", e.g.  MyMod_party_allies.ini
; The mod scans every *_party_allies.ini in this folder and MERGES them
; with this base list, so your entries are additive and update-safe.
;
; FORMAT (one entry per line):
;   Plugin.esm|0xFormID     e.g.  Skyrim.esm|0x13B9A   (Base ID, no leading zeros)
;   Name                    exact display name, case sensitive
; ----------------------------------------------------------------------------
;
; NOTE: Requires the "Quest Allies" setting (Follower HUD, next to Followers
; and Summons) to be ON, or nothing here shows.
;
; Quest allies are temporary story companions (e.g. Hadvar, Delphine, Barbas)
; who fight alongside you but aren't recruited followers. They are detected when
; listed here AND running a with-player package (Follow/Escort/Travel) or in
; combat. The cache refreshes on combat events, so they mostly appear in combat.
; ----------------------------------------------------------------------------

