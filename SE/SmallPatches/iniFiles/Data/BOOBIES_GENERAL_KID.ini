;------------------------------------------------------------------------------------------------
;										General Rules
;------------------------------------------------------------------------------------------------

; These rules attempt to assign the appropriate icon based on standard keywords.
; If a mod author uses such keywords with their included items, BOOBIES will recognize them.

; Book Types
Keyword = BoobiesBookTypeJournal|Book|BookTypeJournal
Keyword = BoobiesBookTypeCrafting|Book|BookTypeCrafting
Keyword = BoobiesBookTypeMissive|Book|BookTypeMissive
Keyword = BoobiesBookTypeRecipe|Book|BookTypeRecipe