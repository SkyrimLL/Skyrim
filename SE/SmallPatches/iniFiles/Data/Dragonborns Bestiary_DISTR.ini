;Distributes the "Bestiary" keywords to the relevant creatures
;Filtering has to be chosen carefully as to not distribute the keywords to wrong creatures, or
;to skip relevant creatures.
;The list is read from top to bottom, please keep that in mind when ordering the keywords (that's why
;BestiaryIce Wolf has to appear before BestiaryWolf, otherwise *EncWolf would capture Ice Wolves as well).
;Do not hesitate to play with ExclusiveGroups as well to get better results
;If you want the creature to be unlocked by dialogue, check the Silt Strider line for an example
