;RPGUI_BestiaryAddEntryOnTalkFaction is used to add the "peaceful" unlock, done 
;by talking/activating the creature (if it's not currently hostile)
;RPGUI_BestiaryAddEntryOnDeathUnique is used to guarantee the unlocking of the entry, even 
;if the player didn't deliver the killing blow themselves. Useful for unique creatures 
;encountered once in a playthrough
Faction = RPGUI_BestiaryAddEntryOnTalkFaction|BestiaryDog,BestiaryGoat,BestiaryCow,BestiaryChicken,BestiaryDwarven Armored Mudcrab,BestiaryHorse,BestiaryArmored Troll,BestiaryHusky,BestiaryBonewolf,BestiaryDwarven Horse,BestiaryShadowmere,BestiaryArvak,BestiaryUnicorn,BestiaryDaedric Horse,BestiaryReindeer,BestiaryFire Wyrm,BestiaryNix-Hound,BestiaryGhost,BestiaryGuar,BestiarySilt Strider|NONE|NONE|NONE|NONE|NONE
Faction = RPGUI_BestiaryAddEntryOnDeathUnique|BestiaryThe Forgemaster,BestiaryThe Messenger,BestiaryThe Sky Orchestrator,BestiaryGuardian Spirits,BestiaryWhite Stag,BestiaryDaedric Horse,BestiarySkeletal Dragon,BestiaryWeb Mother,BestiaryUdefrykte,BestiaryAyleid Lich,BestiaryKarstaag,BestiaryPotema's Remains,BestiaryReaper,BestiaryShadow,BestiaryVampire Lord,BestiaryKeeper,BestiaryFeral Berserker|NONE|NONE|NONE|NONE|NONE

;A few minor adjustments to "Resistance and Weaknesses" distribution, and additions for CC creatures and other mods
;Immune Physical
Perk = 0x80D~Resistances and Weaknesses.esp|BestiarySpectral Draugr,BestiaryPotema's Remains,BestiaryUnicorn,BestiaryWisp
;Resist Slash
Perk = 0x800~Resistances and Weaknesses.esp|BestiaryDwarven Horse,BestiaryProto-Centurion,BestiaryClannfear,BestiaryDaedroth,BestiaryOgrim,BestiaryDurzog
;Resist Piercing
Perk = 0x801~Resistances and Weaknesses.esp|BestiaryAsh Guardian,BestiaryBone Colossus,BestiaryOgre,BestiaryAyleid Lich,BestiaryClannfear,BestiaryDaedroth
;Resist Bludgeoning
Perk = 0x802~Resistances and Weaknesses.esp|BestiaryMasked Bear,BestiaryMinotaur,BestiaryMinotaur Lord,BestiaryOgrim
;Weakness Slash
Perk = 0x803~Resistances and Weaknesses.esp|BestiaryAyleid Lich,BestiaryFlesh Colossus
;Weakness Piercing
Perk = 0x804~Resistances and Weaknesses.esp|BestiarySlaughterfish,BestiaryNix-Hound,BestiaryMinotaur,BestiaryMinotaur Lord,BestiaryOgrim
;Weakness Bludgeoning
Perk = 0x805~Resistances and Weaknesses.esp|BestiaryAsh Guardian,BestiaryDwarven Horse,BestiaryBone Colossus,BestiaryProto-Centurion,BestiaryClannfear,BestiaryDaedroth
;Resist Poison
Spell = 0x80F~Resistances and Weaknesses.esp|BestiaryUnicorn,BestiaryElytra Nymph,BestiaryNix-Hound,BestiaryWeb Mother,BestiaryFeral Berserker
;Resist Magic
Spell = 0x80C~Resistances and Weaknesses.esp|BestiaryUnicorn,BestiaryMinotaur Lord,BestiaryHunger,BestiaryDremora,BestiaryGoblin Warlord,BestiaryGoblin Shaman
;Resist Fire
Spell = 0x806~Resistances and Weaknesses.esp|BestiaryAsh Guardian,BestiaryNix-Hound,BestiaryBone Colossus,BestiaryClannfear,BestiaryDaedroth,BestiaryHunger,BestiaryScamp,BestiaryDremora
;Resist Frost
Spell = 0x807~Resistances and Weaknesses.esp|BestiaryRiekling,BestiaryThe Sky Orchestrator,BestiaryMountain Lion,BestiaryCorrupted Twilight
;Resist Shock
Spell = 0x808~Resistances and Weaknesses.esp|BestiaryDwarven Horse,BestiaryProto-Centurion
;Weakness Fire
