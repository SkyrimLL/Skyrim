;	.: Size Matters - BOS scale transforms for various objects - HamsterSensei12 preferences version :.
;
;	This Base Object Swapper SWAP ini applies scale transforms to decrease (or increase) the size of various plants.
;
;	Note that some transforms have been commented out (";"), since these are objects I personally do not wish to scale. 
;	To apply scale transforms to these objects, remove the relevant semi-colon and set the desired scale. 
;
;	Transforms that are commented out have default scaling (0.7). Applied transforms use my preferred personal settings. 
;	However, scale transforms are easy to adjust by changing the number to a preferred value. 
;	Values below 1.0 decrease size, while values above 1.0 increase the size of objects.
;
;	As a rule of thumb, we're using FormIDs for records in the official master files (although I list ReferenceIDs/names).
;	FormIDs in master files are never changed by other mods. 
;	Its also possible to use ReferenceIDs, particularly for records in mods whose FormIDs can vary depending on whether the mod's plugin has been Eslified.
;	The simplest solution for this, however, is to just use Eslifier (https://www.nexusmods.com/skyrimspecialedition/mods/145168)
;
;	Finally, these inis can contain transforms for mods that users may not have installed. 
;	These transforms remain harmless for users who do not use the relevant mods. 
;	BOS simply skips/ignores records that it cannot identify in the individual user's LO.	
;
