# Example add-on: full grow-up configuration for one race - custom adult
# BASES, VOICE, OUTFIT, and the per-race grow-up override.
#
# When a child finishes growing and "Children grow into adults" is enabled
# (or GrowUpToAdult is set in an add-on), these keys control the new adult:
#
#   - AdultActor_*       ActorBase records the adult is spawned from; a random
#                        entry is picked. _MalePlayer/_FemalePlayer are
#                        preferred when the player is a parent (optional -
#                        without them the _Male/_Female lists apply to player
#                        children too). Without any list, the adult is spawned
#                        as a copy of the same-sex parent when that parent has
#                        a generic base.
#   - AdultActorVoice_*  a VoiceType, applied only when the adult base has no
#                        voice of its own. Entry 0 of the list is used.
#                        Pick a follower-capable voice if you want the vanilla
#                        "Follow me" dialogue to work.
#                        (The shipped BF Adult Pack bases already carry a voice,
#                        so this key only matters for your own voiceless bases.)
#   - AdultOutfit_*      an Outfit equipped at transition, applied only to
#                        adults spawned from AdultActor_* add-on lists. Entry 0
#                        of the list is used. Without this key they get a basic
#                        roughspun tunic. Parent-base copies keep their own outfit.
#   - GrowUpToAdult      per-race override of the MCM "Children grow into
#                        adults" toggle: 1 = always grow, -1 = never grow,
#                        0/absent = follow the MCM toggle.
#                        Precedence: actor add-on > race add-on > MCM/global.
#
# Format is "PluginName:FormID" (hex, no 0x), comma-separated, no spaces.
# The same keys also work in type=actor add-ons (per-NPC) and as
# Global_AdultActor_* / Global_AdultActorVoice_* / Global_AdultOutfit_* in
# type=global add-ons (all races).
#
# This example targets the Argonian race, reusing the shipped BF Adult Pack
# bases (BeeingFemaleAdultPack.esp) as values. It is DISABLED by default -
# set enabled=true (or toggle it in the BeeingFemale MCM AddOn page) to use it.

[AddOn]
name=Adult GrowUp Settings Example
description=(Disabled by default - example only) Shows how to assign adult bases, a voice, an outfit, and the grow-up override to grown-up children of a race.
author=Beeing Female NG
type=race

enabled=false
hidden=false
locked=false

races=1

[Race1]
#Argonian (including vampire variant)
id=Skyrim:13740,Skyrim:8883A

# 1 = children of this race always grow into adults, -1 = never, 0 = follow the MCM toggle.
GrowUpToAdult=0

# Adult bases - here the shipped BF Adult Pack Argonians; a random entry is picked.
AdultActor_Male=BeeingFemaleAdultPack:800,BeeingFemaleAdultPack:801,BeeingFemaleAdultPack:802,BeeingFemaleAdultPack:803,BeeingFemaleAdultPack:804,BeeingFemaleAdultPack:805,BeeingFemaleAdultPack:806,BeeingFemaleAdultPack:807,BeeingFemaleAdultPack:808,BeeingFemaleAdultPack:809
AdultActor_Female=BeeingFemaleAdultPack:80A,BeeingFemaleAdultPack:80B,BeeingFemaleAdultPack:80C,BeeingFemaleAdultPack:80D,BeeingFemaleAdultPack:80E,BeeingFemaleAdultPack:80F,BeeingFemaleAdultPack:810,BeeingFemaleAdultPack:811,BeeingFemaleAdultPack:812,BeeingFemaleAdultPack:813

# Optional: bases used only when the player is a parent (children of NPC
# couples keep using the lists above). Empty = not used.
AdultActor_MalePlayer=
AdultActor_FemalePlayer=

# MaleArgonian / FemaleArgonian - both are follower-capable vanilla voices.
# Only applied if the chosen adult base has no voice (the Adult Pack bases do).
AdultActorVoice_Male=Skyrim:13AEE
AdultActorVoice_Female=Skyrim:13AEF

# FarmClothesOutfit01 - simple vanilla farm clothes.
AdultOutfit_Male=Skyrim:37C53
AdultOutfit_Female=Skyrim:37C53
