; Core Impact Framework - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
#    3: Developer mode (high volume of logs).
iVerboseMode = 1

# When enabled, this parameter allows the mods's resources to be loaded asynchronously, preventing any delay in the game's startup.
# Due to some rare cases of crashes for some people when launching the game, this setting is disabled by default.
bAsynchronousStartup = false

# If enabled, the mod will automatically overwrite or replace invalid script files with valid versions during initialization.
bOverwriteInvalidScripts = true

# If enabled, the mod will extract and save script source files (psc) for debugging or development purposes.
bExtractScriptSources = false


[BloodSpray]
# Enable or disable dynamic blood spray effect when an actor is hit by an attack (1 to enable, 0 to disable).
bStatus = true

# Determines the number of blood sprays to be generated with each call.
iSpawnMult = 1

# Speed multiplier for blood spray.
fSpeedFactor = 1.0

# Gravity multiplier for blood spray.
fGravityFactor = 1.0

# Exponential decay factor applied to each subsequent spray's velocity.
fVelocityDecayFactor = 0.66

# Maximum spread factor for blood sprays, controlling the dispersion of blood spray.
fSpread = 0.15

# Collision layer ID to manage the impacts of dynamic blood spray (between 55 and 64 inclusive).
iCollisionLayerIndex = 59


[DefaultForms]
# Impact Data used on weapons dropped by an actor at the time of death.
sWeaponDefaultImpactData = Skyrim.esm:0x189FC

# Impact Data used on bows dropped by an actor at the time of death.
sWeaponWoodImpactData = Skyrim.esm:0x13EA5

# Impact Data used on heavy shields dropped by an actor at the time of death.
sShieldHeavyImpactData = Skyrim.esm:0x1697B

# Impact Data used on light shields dropped by an actor at the time of death.
sShieldLightImpactData = Skyrim.esm:0x1697A


[Misc]
# Blood spray casting method (visually identical; only affects internal behavior)
#    0: Default method
#    1: Adaptive method (switches based on True Directional Movement's Target Lock Missile feature; helps avoid crashes)
#    2: Permanent alternate method
iUseAlternateBloodSprayAlgorithm = 1

# Prevents a potential game crash when a large number of blood spray effects are triggered simultaneously.
# This issue is not caused by the mod itself but is amplified by the presence of dynamic projectiles.
bBloodSprayImpactWorkaroundEnabled = false
