# ============================================================================
# Active Effect Blacklist
# Effects listed here are hidden from the Follower HUD and the Player Effects widget.
# ============================================================================
# DO NOT EDIT THIS FILE. It ships with Skyrim Party Sheet and may be
# overwritten by future updates, losing your changes.
#
# To hide your own effects, create a NEW file next to this one ending in
# "activeeffects_blacklist.ini", e.g.  MyMod_activeeffects_blacklist.ini
# The mod scans every *activeeffects_blacklist.ini in this folder and MERGES
# them with this base list, so your entries are additive and update-safe.
# Put your entries under a [Blacklist] section in your own file. Restart the
# game after adding a file.
# ----------------------------------------------------------------------------
#
# One effect name per line under [Blacklist].
# Matching is a case-insensitive SUBSTRING test against the effect's in-game name,
# so "TA_AddArmorProtection" also hides "TA_AddArmorProtection_Effect".
# Lines starting with # or ; are comments.
#
# Examples (uncomment to use):
# AOE
# TA_AddArmorProtection

[Blacklist]
Rally