; Dynamic Armor Physics - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

# This parameter skips dependency checks during component loading when set to 1.
bShouldIgnoreMaintenanceChecks = false

# If enabled, the mod will automatically overwrite or replace invalid script files with valid versions during initialization.
bOverwriteInvalidScripts = true

# If enabled, the mod will extract and save script source files (psc) for debugging or development purposes.
bExtractScriptSources = false


[ArmorWeight]

# Enables dynamic armor weight system
bStatus = true

# Weight multiplier applied when no armor is equipped
fNudeMult = 1.0

# Weight multiplier applied when wearing cloth armor
fClothMult = 1.1

# Weight multiplier applied when wearing light armor
fLightMult = 1.5

# Weight multiplier applied when wearing heavy armor
fHeavyMult = 2.0

# Maximum allowed mass value per body part
fMassLimit = 80.0


[ArmorMaterial]

# Enables or disables the armor material assignment system.
# This affects the Havok collision material and therefore the impact sounds played.
bStatus = true

# Material applied to limb shapes when the actor is not wearing armor (this should remain unchanged).
sNudeMaterialID = None

# Material applied to limb shapes when the actor is wearing cloth armor.
sClothMaterialID = Cloth

# Material applied to limb shapes when the actor is wearing light armor.
sLightMaterialID = ArmorLight

# Material applied to limb shapes when the actor is wearing heavy armor.
sHeavyMaterialID = ArmorHeavy

# Determines the effective radius within which the algorithm operates.
fEffectiveRadius = 1280.0
