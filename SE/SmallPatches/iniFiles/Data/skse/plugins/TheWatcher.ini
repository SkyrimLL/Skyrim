; TheWatcher.ini  -  The Watcher  -  goes in Data\SKSE\Plugins\
; Every value here is a starting point. Tune them once the logs show what normal looks like on your setup.
; Output goes to Documents\My Games\Skyrim Special Edition\SKSE\ (TheWatcher.log and the TheWatcher\ folder).

[General]
; 0 = off
; 1 = normal:     watch for stalls, capture evidence when one happens, log one line per loading screen
; 2 = aggressive: everything in normal, plus tighter thresholds, all-thread stacks, and a stats row every interval.
;                 Any key in the [Aggressive] section below replaces the normal value when iMode=2.
iMode=1

; Write a stats row (CSV) every iStatsIntervalSeconds. Aggressive mode always does this.
bStatsLog=0
iStatsIntervalSeconds=60

; A single frame longer than this (milliseconds) counts as a "hitch" in the stats
fHitchMs=100

; Housekeeping: how many stats files and stall-capture folders to keep (oldest are deleted)
iKeepStatsFiles=20
iKeepStallCaptures=10

[Detection]
; Outside loading screens: the main thread has not finished a frame for this many seconds = stall.
; The game often pauses several seconds on the first frame after a load; 15 leaves room for that.
fFrameStallSeconds=15

; Loading screen open with no load progress (objects/cells loading) for this long = warning in the log.
; Some parts of a load (script setup at the end of a save load, for example) fire no load events.
fLoadWarnSeconds=15

; ...for this long = stall, capture the evidence
fLoadStallSeconds=45

; While still stuck, take another capture every N seconds (shows whether it is stuck in the same place)
fRecaptureSeconds=45
iMaxCapturesPerSession=3

; Ignore frame stalls while the game is alt-tabbed (loading-screen stalls are always watched)
bIgnoreWhenUnfocused=1

[Capture]
; Write the main thread's call stack to the log and to stacks.txt
bMainThreadStack=1

; Also record every other thread: their call stacks AND the sampling below (long output, but shows loader/worker threads).
; With this off, only the main thread is recorded and sampled.
bAllThreadStacks=0

; Minidump written when a stall is captured:
;   0 = none
;   1 = small: all thread stacks + module list, usually a few MB  (small enough to upload)
;   2 = medium: adds memory the stacks point to, tens of MB
;   3 = full memory: roughly the size of Skyrim's RAM use (10-20+ GB) and slow to write
iMinidumpLevel=1

; Write the minidump with TheWatcherDump.exe (must sit next to TheWatcher.dll) instead of from inside the frozen game.
; Safer: an in-game dump can deadlock on the same locks the game is stuck on. Falls back to in-game if the helper is missing.
bOutOfProcessDump=1

; Copy every SKSE log written this session into the capture folder, so relaunching can't wipe them
bBackupLogs=1

; Alerts: three beeps + flashing taskbar button on a capture
bBeep=1
bFlashWindow=1
; One short beep when a warning starts (loading slow, before it counts as a stall)
bAlertOnWarning=1

; Label SkyrimSE.exe stack frames with Address Library IDs ("SkyrimSE.exe+02EACBA -> 12345+0x1A"), like CrashLogger.
; Reads Data\SKSE\Plugins\versionlib-<game version>.bin on AE, or version-<game version>.bin on SE
; (both installed by Address Library for SKSE Plugins).
bAddressLibraryIDs=1

; Sample threads this many times per capture, iSampleIntervalMs apart, and label each one:
;   SAME       stack never changed (stuck, OR simply idle/asleep - most idle threads look like this)
;   CHANGED    it ran different code between samples
;   INCOMPLETE a sample could not be taken
; Clues for where to look, not proof. Samples the main thread only unless bAllThreadStacks=1. 1 turns sampling off.
iThreadSamples=5
iSampleIntervalMs=200

[Aggressive]
; Used only when iMode=2. Add any key from the sections above to override it here.
fFrameStallSeconds=6
; A normal save load showed a 7.7s quiet stretch at its end, so 6 was too tight
fLoadWarnSeconds=10
fLoadStallSeconds=20
fRecaptureSeconds=30
iMaxCapturesPerSession=5
bAllThreadStacks=1
; Level 2 adds lock/handle details so the owner of a stuck lock can be identified (tens of MB per dump)
iMinidumpLevel=2
iStatsIntervalSeconds=60
