; ============================================================================
; Party Whitelist - Force-show these actors as followers
; ============================================================================
; DO NOT EDIT THIS FILE. It ships with Skyrim Party Sheet and may be
; overwritten by future updates, losing your changes.
;
; To force-show your own actors, create a NEW file next to this one ending in
; "_party_whitelist.ini", e.g.  MyMod_party_whitelist.ini
; The mod scans every *_party_whitelist.ini in this folder and MERGES them
; with this base list, so your entries are additive and update-safe.
;
; NOTE: Whitelist is FormID-ONLY by design. Plain name lines are rejected
; (a display name could match a hostile NPC). Use Plugin.esp|0xFormID only.
; ----------------------------------------------------------------------------
;
; Format: Plugin.esp|0xFormID (no leading zeros required)
; Use xEdit to find the Base ID (not Ref ID) of your pet/companion
;
; Note: These actors will only appear when they have a "Follow" AI package active
; (i.e., when they're actually following you, not when dismissed)
; CC Pets use PetFramework_PetFollowingFaction (Update.esm|0x2F1D) with rank >= 1

