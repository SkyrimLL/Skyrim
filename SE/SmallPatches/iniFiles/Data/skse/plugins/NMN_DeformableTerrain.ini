; NMN_DeformableTerrain

; ========================
; Terrain deformation
; ========================

EnableTessellation = 1
;enables alt+tab from game to any ini 
EnableLiveReload = 1

; transition from snow to other land , 0 = hard edge.
SnowSeamTexels = 2.5

; to control perf lower max factor to 32 (small boost)
; set TargetSpacing to 4.0 (bigger boost, halfs the mod cost)
TessellationMaxFactor = 64.0
TessellationTargetSpacing = 2.0

; ==============
; -----Snow-----
; ==============
;General height of snow 35.0 knee deep
SnowRaiseHeight = 35.0
;how deep legs go into the snow =1 bare ground
SnowTrenchDepth= 0.35
; Weaker value reveals a snow composite rather than bare snow
SnowRevealStrength = 0.4
; Blend trench with other material.
BlendFullDepth = 4.0
BlendStrength = 0.45
; =====================================
; --- Kicked-snow --particle-effect---
; =====================================
;flakes of snow flying =1 (on) =0 (off)
SnowSparkle = 1

; Flakes per second at SnowSparkleFullSpeed. Scaled by how fast you are moving,
; and nothing is thrown below SnowSparkleMinSpeed.
SnowSparkleRate = 500.0
SnowSparkleFullSpeed = 350.0
SnowSparkleMinSpeed = 40.0

; Flake radius in world units, and how long one lives in seconds. Both are
; jittered per flake.
SnowSparkleSize = 1
SnowSparkleLife = 1

; How hard a foot throws - FORWARD along your direction of travel, and up, so you
; run into the cloud instead of leaving it behind you.
SnowSparkleThrow = 500.0
SnowSparkleRise = 100.0

; How much of your own velocity a flake carries away, 0 to 1. 
SnowSparkleInherit = 1.0

; Fall and air. Low gravity and high drag are what make this read as snow
; rather than as gravel; the swirl is the sideways wander on the way down.
SnowSparkleGravity = 500.0
SnowSparkleDrag = 4.2
SnowSparkleSwirl = 100.0

; How white and how solid. Brightness multiplies the sky's own ambient, so it
; is a scale on the scene's light rather than an absolute.
SnowSparkleBrightness = 0.5
SnowSparkleOpacity = 0.5

; Strength of the ragged snowflake silhouette, 0 to 1 . 0 = plain soft motes.
SnowSparkleShape = 1

;=================================
;Magic / shout / explosion impacts
;=================================
EnableMagicImpacts = 1
EnableShoutImpacts = 1
EnableExplosionImpacts = 1
;----------------------------
MagicImpactRadius = 50.0
MagicImpactDepth = 10.0
ShoutImpactRange = 1200.0
ShoutImpactWidth = 1.0
ShoutImpactDepth = 35.0
ExplosionImpactRadiusScale = 0.5
ExplosionImpactMaxRadius = 256.0
ExplosionImpactDepth = 18.0
MagicImpactRimScale = 0.3
MagicImpactSnowMelt = 0.5
HeatMaxRadius = 256.0

; =================================
; OBJECTS
; =================================
; Dropped gear, spent arrows and thrown weapons press into the ground.
EnableObjectStamps = 1
ObjectStampInterval = 0.1
; Multiplier on an object's own bound radius. Above 1 so a dent is wider than
; the thing making it.
ObjectStampRadiusScale = 1.0 
ObjectStampDepthScale = 5.0  
;
; radius at which an object presses to full depth
ObjectFullSizeRadius = 80
;
; How far above the land an object may sit and still count as touching it.
ObjectContactTolerance = 10
;
; How far below the snow an object may be and still leave a mark.
ObjectSinkLimit = 60.0
; ===========================================================================
; Heat
; ===========================================================================
;
EnableHeatSources = 1
;
HeatKeywords = fire,campfire,brazier,firepit,candle,torch,forge,smelt,hearth
;
HeatRadius = 2.5
HeatRadiusScale = 1
HeatMeltPerSecond = 0.85

;1 = ground level
HeatMeltDepthScale = 0.80

;LOW IS SOFT.
HeatShoulder = 0.20

; A torch in an actor's hand melts snow.
HeatFromTorches = 1
HeatTorchRadius = 40.0
HeatTorchScale = 0.45

; ===========================================================================
; Weather - Rise and melt of snow and rain softens a ground, sun hardens it.
; ===========================================================================
; 0 = off.
EnableWeather = 1

; Snow accumulation and melt.
; if set to =1 must set SnowRaiseHeight= 50 or higher, 
; if you dont you will have shallow snow
SnowRaiseWeather = 0

WeatherFillPerSecond = 0.06

; Game hours of precipitation to reach fully soft ground, and of dry weather to
; reach fully firm. 
WeatherSoftenHours = 1.0
WeatherFirmHours = 1.0

; How strongly each kind of precipitation softens, relative to each other.
WeatherSnowSoften = 1.2
WeatherRainSoften = 1.2

; How fast ground dries under cloud, as a fraction of clear weather. Decides
; where the level rests between storms.
WeatherCloudyFirmScale = 0.25

; Depth multiplier at fully soft and fully firm. 1.0 in both turns depth
; modulation off. The rim follows depth on its own.
WeatherSoftDepthScale = 0.35
WeatherFirmDepthScale = 0.70

; REMAINING after a second, so below 1 fades faster.
WeatherSoftDecayScale = 0.95
WeatherFirmDecayScale = 1.05

; ===========================================================================
;!BLOOOD on snow
; ===========================================================================
EnableBloodDecals = 1
BloodDecalTexturePrefixes = blood,decalsblood,bigspatter

;=============================================================
;SETTINGS BELOW ARE NOT TO BE CHANGED  -- everything is tunned to them 
; ==========================
; Footprints in the ground
; ==========================
;How high above a ground a foot can be and stamp
StampGroundClearance = 0.5
;global decay value / per second / value from 0-0.99
StampDecayPerSecond = 0.99
; The steepest slope the field may hold, in degrees. 0 = off. Snow slumps rather
; than standing in a cliff.
StampSlopeLimit = 50

; ===========================================================================
; surface deformation--base settings// use overrides in NMN_DeformableTerrain
; ===========================================================================
;                 depth  radius  shoulder  decay   rim   print  clearance
ResponseSnow    = 0.80,  1.00,    0.10,   1.05,  1.45,     0,       25
ResponseMud     = 0.20,  1.50,    0.45,   2.00,  1.45,     0,       1
ResponseAsh     = 0.20,  1.50,    0.45,   2.00,  1.45,     0,       1
ResponseSand    = 0.20,  1.50,    0.45,   2.00,  1.45,     0,       1
ResponseDirt    = 0.20,  1.50,    0.45,   2.00,  1.45,     0,       1
ResponseGrass   = 0.20,  1.50,    0.45,   2.00,  1.45,     0,       1
ResponseGravel  = 0.35,  1.00,    0.20,   0.97,  0.50,     0,       1
ResponseStone   = 0.00,  1.00,    0.30,   1.00,  0.00,     0,       1
ResponseUnknown = 0.20,  1.50,    0.45,   2.00,  0.45,     0,       1

