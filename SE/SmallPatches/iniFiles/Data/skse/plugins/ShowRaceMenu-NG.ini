; ShowRaceMenu NG - Developper Settings
; WARNING: The parameters in this file are intended for advanced users. These are advanced features that you probably do not want to modify.

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

# Completely enables or disables the mod. Useful if you encounter a conflict with another mod (1 enable, 0 disable).
bEnabled = 1


[Restore]
# Restores your skill levels after changing race in the character creator (1 enable, 0 disable).
bRestoreSkills = 1

# Restores your Health, Stamina and Magicka after changing race in the character creator (1 enable, 0 disable).
bRestoreAttributes = 1

# Restores the number of times each skill has been made Legendary after changing race (1 enable, 0 disable).
bRestoreLegendaryLevels = 1

# Restores your character level and experience points after changing race (1 enable, 0 disable).
bFixPlayerLevel = 1


[Tweaks]
# When enabled, racial skill bonuses are recalculated to match your new race after a race change (1 enable, 0 disable).
bApplyRaceSkillBoosts = 1

# Controls when your vampire race is reapplied if you are a vampire.
#    0: Disabled (your vampire race will not be restored)
#    1: On exit (applied when you close the character creator)
#    2: Real-time (applied immediately as you browse races in the menu)
iVampireRaceSyncMode = 2

# Updates certain quest scripts (Companions, Dawnguard) to reflect your new race (1 enable, 0 disable).
bUpdatePapyrusScripts = 1


[Misc]
# Hides the player's helmet while using the character creator and restores it afterward (1 enable, 0 disable).
bHideHelmet = 1

# Forces the character creator to use the full race menu instead of the limited version (1 enable, 0 disable).
bOverrideLimitedRaceMenu = 0

# Automatically fills in the player's name at the end of character creation instead of requiring retyping (1 enable, 0 disable).
bFillPlayerName = 1
