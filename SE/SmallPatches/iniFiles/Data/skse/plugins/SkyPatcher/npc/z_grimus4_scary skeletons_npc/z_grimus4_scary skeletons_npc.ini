; =========================================================================
; CLASSIC SKELETONS OVERHAUL V3 - STATS & SCALING
; Note: Armor, Damage Perks, Spells, and Loot are handled by SPID.
; =========================================================================

; -------------------------------------------------------------------------
; BLOCK 1: Universal Scaling & Hyper-Mobility
; Uncaps levels, applies 130% movement speed, and sets confidence to Foolhardy.
; -------------------------------------------------------------------------
filterByEditorIdContains=Skeleton:speedMult=130:setConfidence=foolhardy:setPcLevelMult=true:calcLevelMax=0

; -------------------------------------------------------------------------
; BLOCK 2: Tiered Minimum Levels & Skill Mastery
; -------------------------------------------------------------------------
; Base Skeletons (Level 5+)
filterByEditorIdContains=Skeleton:calcLevelMin=5

; Melee / Bow Skeletons (Level 10+)
filterByEditorIdContainsOr=SkeletonMelee, SkeletonBow:calcLevelMin=10

; Skeleton Mages (Level 15+ & 100 Destruction)
filterByEditorIdContains=SkeletonMage:calcLevelMin=15:changeSkills=destruction=100

; Skeleton Heroes (Level 25+)
filterByEditorIdContains=SkeletonHero:calcLevelMin=25

; Skeleton Champions (Level 50+ & 100 Alteration)
filterByEditorIdContains=SkeletonChampion:calcLevelMin=50:changeSkills=alteration=100