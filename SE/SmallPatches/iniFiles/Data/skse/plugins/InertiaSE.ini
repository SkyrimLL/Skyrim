[Log]
enableLog=0

[MoveInertia]

; ------------------------------------------------------------
; Logging / scope
; ------------------------------------------------------------
bOnlyFirstPerson=0       ; Apply inertia only in first-person camera

; ------------------------------------------------------------
; Base inertia (response feel)
; ------------------------------------------------------------
fAccel=18.0              ; Acceleration responsiveness (1/sec). Higher = reaches desired movement faster
fDecel=22.0              ; Deceleration responsiveness (1/sec). Higher = stops faster (less "ice skating")

; ------------------------------------------------------------
; Reverse direction "momentum cut"
; ------------------------------------------------------------
bReverseCutAffects=1     ; If enabled, cut current momentum once when a reverse starts (prevents instant flip)
fReverseCutMin=1.0       ; Momentum kept at low/normal weight (1.0 = no cut)
fReverseCutMax=0.35      ; Momentum kept at high weight / overloaded (0.35 = keep 35%, cut 65%)

; ------------------------------------------------------------
; Numeric stability / movement range
; ------------------------------------------------------------
fDeadZone=0.0015         ; Input deadzone. Values below are treated as zero (prevents tiny drift)
fDtClamp=0.10            ; Max delta time used for smoothing. Larger dt resets state to avoid jumps (seconds)
fMax=2.0                 ; Clamp for movement magnitude (game uses ~2.0 for full speed)

; ------------------------------------------------------------
; Weight influence on inertia (CarryWeight ratio)
; ------------------------------------------------------------
bWeightAffectsInertia=1  ; If enabled, carrying weight reduces responsiveness (heavier = more inertia)
fWeightStartRatio=0.50   ; Weight ratio threshold where effects start (e.g., 0.50 = after 50% capacity)
fWeightCurve=1.8         ; Curve exponent for scaling. >1 = mild at first, stronger near max weight
fWeightMinUp=0.20        ; Accel scale at 100% capacity (0.20 = accel becomes 20% of base)
fWeightMinDn=0.55        ; Decel scale at 100% capacity (0.55 = decel becomes 55% of base)
fWeightOverCap=0.20      ; Scale when overloaded (ratio >= 1.0). Applies to accel and decel

; ------------------------------------------------------------
; Turn slowdown on sharp turns
; ------------------------------------------------------------
bTurnWeightAffects=1      ; If enabled, sharp-turn slowdown becomes stronger with higher weight
fTurnStrengthMulAtMax=2.0 ; Strength multiplier at 100% capacity (2.0 = twice as strong)
fTurnMinMultAtMax=0.25    ; Minimum movement multiplier at 100% capacity (how slow it may get)
fTurnMinMultOverCap=0.20  ; Minimum movement multiplier when overloaded

fTurnWindowSec=0.15       ; Time window used to accumulate turn angle (seconds). Larger = easier to trigger
fTurnHardAngleDeg=45.0    ; Turn angle threshold (degrees) where slowdown starts within the window
fTurnMaxAngleDeg=120.0    ; Turn angle (degrees) where slowdown reaches full strength

fTurnHardStrength=0.95    ; Slowdown strength at/above max angle (0.95 = up to 95% reduction before min clamp)
fTurnHardMinMult=0.35     ; Absolute minimum movement multiplier (clamp) at base weight
fTurnMinMoveLen=0.25      ; Only apply turn slowdown if you're actually moving (min filtered magnitude)
; ------------------------------------------------------------
; Equipped Weight Settings (Armor)
; ------------------------------------------------------------
bEquippedWeightAffectsInertia=1   ; 1 = equipped weight (armor + weapons) affects acceleration and deceleration, 0 = ignore equipped weight (only carry weight ratio is used)
fEquippedCurve=1.250000           ; exponent of the scaling curve: higher values delay the effect and make it ramp up more sharply toward heavy loadouts
fEquippedKneeWeight=8.000000     ; equipped weight at which inertia from gear starts to become noticeable
fEquippedMaxWeight=60.000000      ; equipped weight at which the maximum inertia effect from gear is reached
fEquippedMinUp=0.200000           ; minimum acceleration multiplier at max equipped weight (lower = slower acceleration)
fEquippedMinDn=0.450000           ; minimum deceleration multiplier at max equipped weight (lower = slower stopping)
fEquippedOverCapMul=1.000000      ; additional multiplier applied if carry weight is over capacity while wearing heavy gear
; ------------------------------------------------------------
; Equipped Weight Settings (Weapon)
; ------------------------------------------------------------
bWeaponAffectsInertia=1
fWeaponCurve=1.500000
fWeaponKneeWeight=10.000000
fWeaponMaxWeight=30.000000
fWeaponMinUp=0.900000
fWeaponMinDn=0.920000
fWeaponOverCapMul=1.000000
fWeaponWeightMul=0.650000
