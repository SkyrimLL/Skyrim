; Grid Inventory — unique items
; 유니크 아이템 지정
;
; A unique item is marked with an AMBER wedge in the tile's top-right corner;
; an ordinary enchanted one gets the same wedge in blue.
; 유니크 아이템은 칸 오른쪽 위 모서리에 호박색 쐐기, 그 외 부여된 물건은
; 같은 자리에 파란 쐐기가 붙습니다.
;
; The mark is decided automatically first: an item counts as unique when its
; enchantment has no base enchantment -- one the player can never learn. That
; finds the Daedric artifacts and the named weapons carrying a bespoke
; enchantment (Dawnbreaker, Volendrung, Mehrunes' Razor, the Mace of Molag Bal,
; the Ebony Blade, Chillrend, Keening, the Nightingale weapons, Dragonbane,
; Ghostblade, the Pale Blade, Trollsbane, Harkon's Sword, Auriel's Bow ...).
; Staves and conjured (bound) weapons are excluded: every one of them passes
; that test for reasons that have nothing to do with rarity.
; 표시는 먼저 자동으로 정해집니다 — 부여가 있고 그 부여를 플레이어가 배울 수
; 없으면 유니크로 봅니다. 지팡이와 소환 무기는 제외합니다(전부 통과해서 신호가
; 되지 못함).
;
; This file is for what that rule CANNOT see:
;   - no enchantment at all, or a scripted effect
;   - an enchantment the player CAN learn, on an item that is still unique
;   - anything a MOD adds
; 이 파일은 그 규칙으로 볼 수 없는 것들을 위한 것입니다:
;   - 부여가 없거나 효과가 스크립트인 것
;   - 분해 가능한 부여를 가졌지만 그래도 유니크인 것
;   - 모드가 추가한 것
;
; Format — one form per line, the same key the other ini files use.
; 형식 — 한 줄에 하나, 다른 ini와 같은 키 문법.
;   Plugin.esm|0xLocalID        turn the mark ON   (켜기)
;   Plugin.esm|0xLocalID = 0    turn the mark OFF  (끄기 — 자동 판정을 뒤집습니다)
;
; The id is the LOCAL one (no load-order prefix) -- the plugin name in front is
; what places it, so the load order may put that plugin anywhere.
; ID는 로드오더 접두사를 뺀 로컬 값입니다 — 앞의 플러그인 이름이 그 자리를
; 정하므로 로드오더가 어떻게 바뀌어도 됩니다.
;
; A line naming a plugin you do not have is skipped, so it is safe to keep
; entries for mods you have uninstalled.
; 없는 플러그인을 가리키는 줄은 건너뜁니다 — 지운 모드의 줄을 남겨둬도 됩니다.
;
; Reloaded every time the inventory opens; no restart needed.
; 인벤토리를 열 때마다 다시 읽습니다. 재시작이 필요 없습니다.

