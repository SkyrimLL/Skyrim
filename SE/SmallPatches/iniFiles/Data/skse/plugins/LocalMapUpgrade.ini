[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=2

[MapMenu]

; Makes the local map colorful or black and white: 0 = black and white (vanilla), 1 = colorful
bLocalMapColor=1

; Enables fog of war in the local map. Disabling it reveals the unvisited parts of the map: 0 = disabled, 1 = enabled (vanilla)
bLocalMapFogOfWar=1

; Controls the local map pan speed when pressing up, down, left or right in the keyboard
fMapLocalKeyboardPanSpeed=50.0

; Shows enemies in the local map: 0 = disabled (vanilla), 1 = enabled
bMapLocalShowEnemyActors=1

; Shows hostile actors in the local map: 0 = disabled (vanilla), 1 = enabled
bMapLocalShowHostileActors=1

; Shows guards in the local map: 0 = disabled (vanilla), 1 = enabled
bMapLocalShowGuardActors=1

; Shows dead bodies in the local map: 0 = disabled (vanilla), 1 = enabled
bMapLocalShowDeadActors=1

; Shows teammates in the local map: 0 = disabled (vanilla), 1 = enabled
bMapLocalShowTeammateActors=1

; Shows neutral NPCs in the local map: 0 = disabled (vanilla), 1 = enabled
bMapLocalShowNeutralActors=1

; Integration with game mechanics. Shows NPCs in the local map only when a detect life/dead effect is active.
; For those who think that this mod is a little OP and want more immersion: 0 = disabled, 1 = enabled
bImmersiveMode=1